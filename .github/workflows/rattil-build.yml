name: Rattil ASR build verification
on:
  push:
    branches:
      - fix/rattil-self-hosted-asr
  pull_request:
    branches:
      - fix/rattil-self-hosted-asr
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/smoke-asr.mjs
      - name: Verify bundled output and local runtime assets
        run: |
          test -s dist/index.html
          test -s dist/ort/ort-wasm-simd-threaded.wasm
          test -s dist/ort/ort-wasm-simd-threaded.mjs
          test -s dist/models/zipformer_a0w_ep1_a05.int8.onnx
          test -s dist/models/zipformer_a0w_ep1_a05.io.json
          test -s dist/zipformer_quran.json
          test -s dist/quran.json
          ! grep -R "cdn.jsdelivr.net/npm/onnxruntime-web\|cdn.jsdelivr.net/npm/@tilawa/core" dist
