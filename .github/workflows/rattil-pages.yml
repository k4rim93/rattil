name: Rattil GitHub Pages deployment
on:
  push:
    branches:
      - deploy/github-pages-basepath
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Verify GitHub Pages paths and local ASR assets
        run: |
          test -s dist/index.html
          test -n "$(find dist/assets -maxdepth 1 -name '*.js' -print -quit)"
          test -s dist/ort/ort-wasm-simd-threaded.wasm
          test -s dist/ort/ort-wasm-simd-threaded.mjs
          test -s dist/models/zipformer_a0w_ep1_a05.int8.onnx
          test -s dist/models/zipformer_a0w_ep1_a05.io.json
          test -s dist/zipformer_quran.json
          test -s dist/quran.json
          grep -q '/rattil/' dist/index.html
          grep -q '"/rattil/"' dist/manifest.webmanifest
          ! grep -R "cdn.jsdelivr.net/npm/onnxruntime-web\\|cdn.jsdelivr.net/npm/@tilawa/core" dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
